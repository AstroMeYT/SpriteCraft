[package]
name = "spritecraft"
version = "0.2.0-r2021"
edition = "2021"
description = "SpriteCraft - 2D pixel art and animation studio"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
flate2 = "1"
ab_glyph = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
